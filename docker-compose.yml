name: topoknow

services:
  postgres:
    image: postgres:15-alpine
    container_name: topoknow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: topoknow
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: topoknow-backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=topoknow
      - DB_SSLMODE=disable
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-key}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-minimax}
      - AI_MODEL=${AI_MODEL:-MiniMax-Text-01}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:6010,http://127.0.0.1:6010}
    ports:
      - "6011:6011"
    volumes:
      - ./backend/config.yaml:/app/config.yaml
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: topoknow-frontend
    ports:
      - "6010:80"
    depends_on:
      - backend
